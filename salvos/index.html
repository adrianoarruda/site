<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<script>/* Cópia no GitHub Pages: leva para o domínio oficial */ if (location.hostname.endsWith("github.io")) location.replace("https://www.adrianoarruda.com" + location.pathname.replace(/^\/site/, "") + location.search + location.hash);</script>
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="icon" href="/favicon.ico" sizes="32x32">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<meta name="theme-color" content="#000000">
<title>Salvos · Adriano Arruda</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,500..800&family=Geist:wght@400..600&family=Geist+Mono:wght@400..500&display=swap">
<style>
  /* Mesma identidade da v3: preto e branco, verde neon como única cor de destaque */
  :root {
    --ink: #000; --slate: #8a8a8a; --soft: #5c5c5c; --line: #e5e5e5; --card: #f3f3f3; --paper: #fff;
    --green: #ff3b1f; --green-h: #e5301a; --blue: #4686ac; --red: #d4321c;
    --sans: "Geist", "Helvetica Neue", Arial, sans-serif;
    --mono: "Geist Mono", ui-monospace, Consolas, monospace;
    --cond: "Archivo", "Arial Narrow", sans-serif;
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html, body { margin: 0; }
  body { font: 16px/1.5 var(--sans); letter-spacing: -.01em; color: var(--ink); background: var(--paper); }
  a { color: inherit; }
  .wrap { max-width: 1200px; margin: 0 auto; padding-inline: 24px; }
  .mono { font-family: var(--mono); text-transform: uppercase; letter-spacing: .04em; }
  .cond { font-family: var(--cond); font-stretch: 68%; font-weight: 700; text-transform: uppercase; }

  nav.top { height: 72px; background: #000; }
  nav.top .wrap { height: 100%; display: flex; align-items: center; justify-content: space-between; gap: 16px; }
  .brand { color: #fff; text-decoration: none; font-size: 26px; letter-spacing: -.02em; }
  .voltar { color: #979797; font-size: 14px; text-decoration: none; }
  .voltar:hover { color: #fff; }

  header.hero { background: #000; color: #fff; padding: 56px 0 96px; }
  .crumb { font-size: 12px; color: #979797; }
  .crumb::before { content: "— "; }
  h1 { margin: 16px 0 0; font-size: clamp(64px, 11vw, 132px); line-height: .92; letter-spacing: -.04em; }
  h1 .dim { color: #5c5c5c; }
  .hero p { margin: 22px 0 0; max-width: 56ch; color: #cdcdcd; font-size: 18px; letter-spacing: -.02em; }

  main { background: var(--paper); border-radius: 64px 64px 0 0; margin-top: -64px; position: relative; padding: 56px 0 96px; min-height: 50vh; }

  .btn { font: 500 15px var(--sans); letter-spacing: -.01em; border: 0; cursor: pointer; height: 44px; padding-inline: 20px; display: inline-flex; align-items: center; gap: 8px; text-decoration: none; }
  .btn.green { background: var(--green); color: #000; border-radius: 9999px; }
  .btn.green:hover { background: var(--green-h); }
  .btn.dark { background: #000; color: #fff; border-radius: 12px; }
  .btn.dark:hover { background: #222; }
  .btn.soft { background: var(--card); color: #000; border-radius: 12px; }
  .btn.soft:hover { background: #e9e9e9; }
  .btn:disabled { opacity: .5; cursor: wait; }

  input, textarea { font: 16px var(--sans); color: var(--ink); background: var(--card); border: 1px solid transparent; border-radius: 12px; padding: 11px 14px; width: 100%; }
  input:focus, textarea:focus { outline: none; border-color: #000; background: #fff; }
  textarea { resize: vertical; min-height: 84px; }
  label.f { display: grid; gap: 6px; font-size: 13px; color: var(--soft); }
  label.f span { font-family: var(--mono); text-transform: uppercase; letter-spacing: .04em; font-size: 11px; }
  :focus-visible { outline: 2px solid #000; outline-offset: 2px; }

  /* Portão da senha */
  .gate { max-width: 420px; display: grid; gap: 14px; }
  .gate h2 { margin: 0; font-size: 44px; line-height: .9; letter-spacing: -.03em; }
  .gate p { margin: 0; color: var(--soft); }
  .gate .row { display: flex; gap: 8px; }
  .gate .row input { flex: 1; }
  .lembrar { display: flex; gap: 8px; align-items: center; font-size: 14px; color: var(--soft); cursor: pointer; }
  .erro, .gate .erro { color: var(--red); font-size: 14px; margin: 0; min-height: 21px; }

  /* Barra de ferramentas */
  .bar { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; margin-bottom: 36px; }
  .bar input[type=search] { flex: 1 1 260px; max-width: 420px; border-radius: 9999px; padding-left: 18px; }
  .bar .n { font-size: 12px; color: var(--slate); margin-left: auto; }
  .bar .sair { background: none; border: 0; color: var(--slate); font: 14px var(--sans); cursor: pointer; text-decoration: underline; }

  /* Formulário de inclusão */
  .novo { background: #000; color: #fff; border-radius: 24px; padding: 28px; margin-bottom: 40px; display: grid; gap: 16px; }
  .novo[hidden] { display: none; }
  .novo h3 { margin: 0; font-size: 36px; line-height: .9; letter-spacing: -.03em; }
  .novo .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
  .novo .full { grid-column: 1 / -1; }
  .novo label.f { color: #979797; }
  .novo input, .novo textarea { background: #1a1a1a; color: #fff; }
  .novo input:focus, .novo textarea:focus { border-color: var(--green); background: #111; }
  .novo .acoes { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  .novo .btn.soft { background: #1a1a1a; color: #fff; }
  .novo .btn.soft:hover { background: #262626; }
  .novo .erro { color: #ff8a73; }
  .novo .dica { font-size: 12px; color: #6f6f6f; }
  .fonte { justify-self: start; font-size: 11px; color: #fff; background: var(--blue, #4686ac); border-radius: 9999px; padding: 3px 9px; }

  /* Lista compacta (07/11/2026): uma tabela por categoria, dentro de um cartão branco */
  .cats { display: flex; flex-wrap: wrap; gap: 6px; margin: -16px 0 22px; }
  .chip { font: 13px var(--sans); border: 1px solid var(--line); background: #fff; color: var(--soft); border-radius: 9999px; padding: 5px 12px; cursor: pointer; }
  .chip:hover { border-color: #cfcfcf; color: var(--ink); }
  .chip.on { background: var(--ink); border-color: var(--ink); color: #fff; }
  .chip small { font-family: var(--mono); font-size: 11px; opacity: .7; margin-left: 4px; }
  .tabela { background: #fff; border: 1px solid var(--line); border-radius: 14px; overflow: hidden; }
  .cat[hidden] { display: none; }
  .cat h2 { margin: 0; display: flex; align-items: baseline; gap: 10px; font: 600 12px var(--mono); text-transform: uppercase; letter-spacing: .05em; color: var(--soft); background: #fafafa; padding: 10px 18px; border-top: 1px solid var(--line); }
  .cat:first-child h2 { border-top: 0; }
  .cat h2 small { font-weight: 400; color: var(--slate); }
  .lk { display: grid; grid-template-columns: minmax(200px, 1.1fr) minmax(0, 3fr) 92px 64px; gap: 4px 20px; align-items: baseline; padding: 11px 18px; border-top: 1px solid var(--line); }
  .cat h2 + .lk { border-top: 0; }
  .lk:hover { background: #fafaf9; }
  .lk[hidden] { display: none; }
  .lk .nome { display: grid; gap: 1px; min-width: 0; }
  .lk a.t { font-weight: 600; font-size: 15px; letter-spacing: -.02em; text-decoration: none; }
  .lk a.t:hover { text-decoration: underline; }
  .lk .host { font-size: 11px; color: var(--slate); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .lk .d { margin: 0; color: var(--soft); font-size: 14px; line-height: 1.45; }
  .lk .fonte { font-size: 10px; padding: 1px 7px; margin-left: 6px; vertical-align: 1px; }
  .lk .quando { font-size: 11px; color: var(--slate); white-space: nowrap; }
  .lk .rm { background: none; border: 0; color: var(--slate); font: 13px var(--sans); cursor: pointer; padding: 0; justify-self: end; }
  .lk .rm:hover { color: var(--red); text-decoration: underline; }
  @media (max-width: 760px) {
    .lk { grid-template-columns: minmax(0, 1fr) auto; }
    .lk .nome { grid-column: 1; } .lk .rm { grid-column: 2; grid-row: 1; }
    .lk .d { grid-column: 1 / -1; } .lk .quando { display: none; }
  }
  .vazio { color: var(--soft); }

  footer { border-top: 1px solid var(--line); padding: 24px 0 40px; color: var(--slate); font-size: 12px; }

  @media (max-width: 640px) {
    .wrap { padding-inline: 16px; }
    header.hero { padding: 40px 0 88px; }
    main { border-radius: 40px 40px 0 0; margin-top: -48px; padding-top: 40px; }
    .novo { padding: 20px; border-radius: 20px; }
    .novo .grid { grid-template-columns: 1fr; }
    .gate .row { flex-direction: column; }
    .bar .n { margin-left: 0; width: 100%; }
  }

  /* Barra única da Área privada (07/11/2026): cabeçalho claro, no padrão da visão geral */
  body { background: #f5f5f4; }
  header.hero { background: transparent; color: var(--ink); padding: 28px 0 22px; }
  header.hero h1 { font-size: 44px; line-height: .95; margin-top: 4px; }
  header.hero h1 .dim { color: inherit; }
  header.hero .crumb::before { content: none; }
  header.hero .crumb { font-size: 11.5px; color: var(--slate); }
  header.hero p { color: var(--soft); font-size: 15px; margin-top: 10px; }
  main { background: transparent; border-radius: 0; margin-top: 0; padding-top: 8px; }
  .wrap { max-width: 1440px; }
  /* Campos brancos com borda: no fundo cinza da Área privada, o cinza-claro antigo sumia */
  input, textarea { background: #fff; border-color: var(--line); }
  input:focus, textarea:focus { background: #fff; border-color: #000; }
  .novo input, .novo textarea { border-color: transparent; }
  @media (max-width: 640px) { header.hero { padding: 22px 0 16px; } header.hero h1 { font-size: 36px; } main { border-radius: 0; margin-top: 0; padding-top: 8px; } }
  /* Página Salvos (07/11/2026): abas Links úteis, YouTube e Instagram */
  .abas { display: flex; gap: 4px; border-bottom: 1px solid var(--line); margin: 0 0 24px; overflow-x: auto; }
  .aba { font: 500 15px var(--sans); letter-spacing: -.01em; padding: 10px 14px; background: none; border: 0; border-bottom: 2px solid transparent; color: var(--soft); cursor: pointer; white-space: nowrap; display: flex; gap: 8px; align-items: baseline; }
  .aba:hover { color: var(--ink); }
  .aba[aria-selected="true"] { color: var(--ink); border-bottom-color: #ff3b1f; }
  .aba small { font: 12px var(--mono); color: var(--slate); }
  .painel[hidden] { display: none; }
  #p-videos .cats { margin: 0 0 10px; }
  .abas { scrollbar-width: none; }
  .abas::-webkit-scrollbar { display: none; }
  @media (max-width: 640px) { .aba { padding: 10px 9px; font-size: 14px; } .aba .pv { display: none; } }
  .vbar { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; margin-bottom: 14px; }
  .vbar input[type=search] { flex: 1 1 260px; max-width: 420px; border-radius: 9999px; padding-left: 18px; }
  .vbar label { display: flex; gap: 6px; align-items: center; font-size: 14px; color: var(--soft); cursor: pointer; margin-left: auto; }
  .vbar label input { width: auto; }
  .fonte-linha { font-size: 12.5px; color: var(--slate); margin: 0 0 12px; }
  .vd { display: grid; grid-template-columns: 22px 72px minmax(0, 1.4fr) minmax(0, 1.6fr) 120px; gap: 4px 16px; align-items: center; padding: 10px 18px; border-top: 1px solid var(--line); }
  .cat h2 + .vd { border-top: 0; }
  .vd:hover { background: #fafaf9; }
  .vd[hidden] { display: none; }
  .vd.feito { opacity: .55; }
  .vd.feito a.t { text-decoration: line-through; }
  .vd input[type=checkbox] { width: 18px; height: 18px; margin: 0; padding: 0; accent-color: #0b0b0b; cursor: pointer; }
  .vd .mini { width: 72px; height: 40px; border-radius: 6px; background: #eee center / cover no-repeat; display: block; }
  .vd .mini.sq { width: 40px; }
  .vd .nome { display: grid; gap: 2px; min-width: 0; }
  .vd a.t { font-weight: 600; font-size: 14.5px; letter-spacing: -.02em; text-decoration: none; overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
  .vd a.t:hover { text-decoration: underline; }
  .vd .meta .as { color: var(--soft); }
  .vd .meta { font-size: 11.5px; color: var(--slate); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .vd .d { margin: 0; color: var(--soft); font-size: 13.5px; line-height: 1.4; }
  .vd .acao { justify-self: end; background: none; border: 0; color: var(--slate); font: 13px var(--sans); cursor: pointer; padding: 0; }
  .vd .acao:hover { color: var(--ink); text-decoration: underline; }
  .vd .nota { grid-column: 3 / -1; font-size: 13px; color: var(--ink); background: #fff8e6; border-radius: 8px; padding: 6px 10px; }
  .vd .nota small { display: block; color: var(--slate); font-size: 11px; }
  .vd .editor { grid-column: 3 / -1; display: grid; gap: 6px; }
  .vd .editor textarea { min-height: 64px; font-size: 14px; }
  .vd .editor div { display: flex; gap: 8px; }
  .vd .editor button { font: 500 13px var(--sans); border-radius: 8px; padding: 6px 12px; cursor: pointer; border: 1px solid var(--line); background: #fff; }
  .vd .editor button.ok { background: #0b0b0b; color: #fff; border-color: #0b0b0b; }
  .mais { display: block; width: 100%; background: #fafafa; border: 0; border-top: 1px solid var(--line); padding: 10px; font: 500 13px var(--sans); color: var(--soft); cursor: pointer; }
  .mais:hover { color: var(--ink); }
  details.desc { margin-top: 12px; font-size: 13px; color: var(--soft); }
  details.desc ul { margin: 6px 0 0; padding-left: 18px; }
  @media (max-width: 760px) {
    .vd { grid-template-columns: 22px 56px minmax(0, 1fr); }
    .vd .mini { width: 56px; height: 32px; } .vd .mini.sq { width: 32px; height: 32px; }
    .vd .d { grid-column: 3; } .vd .acao { grid-column: 3; justify-self: start; }
    .vd .nota, .vd .editor { grid-column: 1 / -1; }
    .vbar label { margin-left: 0; }
  }
</style>
</head>
<body>
<script src="/privado/barra.js"></script>

<header class="hero">
  <div class="wrap">
    <div class="crumb mono">Área privada</div>
    <h1 class="cond">Salvos</h1>
    <p>Links úteis para ter sempre à mão e o que você salvou no YouTube e no Instagram, já triado pelo Claude. Marque o que já viu.</p>
  </div>
</header>

<main>
  <div class="wrap">

    <section id="area" hidden>
      <nav class="abas" role="tablist" aria-label="Tipo de salvo">
        <button type="button" class="aba" role="tab" data-aba="links" aria-selected="true">Links úteis <small id="n-links"></small></button>
        <button type="button" class="aba" role="tab" data-aba="youtube" aria-selected="false">YouTube <small id="n-youtube"></small></button>
        <button type="button" class="aba" role="tab" data-aba="instagram" aria-selected="false">Instagram <small id="n-instagram"></small></button>
      </nav>

      <div class="painel" id="p-links">
      <div class="bar">
        <input type="search" id="busca" placeholder="Buscar por nome, site ou assunto" aria-label="Buscar links">
        <button class="btn green" id="abrir-novo" type="button">+ Incluir link</button>
        <span class="n mono" id="total"></span>
      </div>

      <form class="novo" id="novo" hidden>
        <h3 class="cond">Novo link</h3>
        <div class="grid">
          <label class="f"><span>Endereço</span><input type="url" id="n-url" placeholder="https://" required></label>
          <label class="f"><span>Nome</span><input type="text" id="n-t" maxlength="120" required></label>
          <label class="f"><span>Categoria</span><input type="text" id="n-cat" list="cats" maxlength="60" placeholder="Design, Dashboards, IA…"></label>
          <datalist id="cats"></datalist>
          <label class="f full"><span>Para que serve</span><textarea id="n-d" maxlength="400"></textarea></label>
          <label class="f full"><span>Feed (opcional): para o blog ler este site</span><input type="url" id="n-feed" maxlength="2000" placeholder="https://…/feed ou …/rss"><small class="dica">Com o feed, o site entra nas fontes da rotina de rascunhos de segunda. Costuma ser o endereço do site + /feed, /rss ou /rss.xml.</small></label>
        </div>
        <div class="acoes">
          <button class="btn green" id="salvar" type="submit">Salvar link</button>
          <button class="btn soft" id="cancelar" type="button">Cancelar</button>
        </div>
        <p class="erro" id="novo-erro" role="alert"></p>
      </form>

      <div class="cats" id="filtros" role="group" aria-label="Filtrar por categoria"></div>
      <div class="tabela" id="lista"></div>
      <p class="vazio" id="vazio" hidden>Nada encontrado com essa busca.</p>
      </div>

      <div class="painel" id="p-videos" hidden>
        <div class="vbar">
          <input type="search" id="vbusca" placeholder="Buscar por título, canal ou assunto" aria-label="Buscar nos salvos">
          <div class="cats" id="vordem" role="group" aria-label="Ordem" style="margin:0"><button type="button" class="chip" data-ordem="recentes">Mais recentes</button><button type="button" class="chip" data-ordem="assunto">Por assunto</button></div>
          <label><input type="checkbox" id="esconde"> Esconder o que já vi</label>
        </div>
        <div class="cats" id="vprio" role="group" aria-label="Filtrar por prioridade" style="margin:0 0 8px"></div>
        <div class="cats" id="vassunto" role="group" aria-label="Filtrar por assunto"></div>
        <p class="fonte-linha" id="vfonte"></p>
        <div class="tabela" id="vlista"></div>
        <p class="vazio" id="vvazio" hidden>Nada aqui com esses filtros.</p>
        <div id="vdesc"></div>
      </div>
    </section>
  </div>
</main>

<footer><div class="wrap mono">Adriano Arruda · salvos</div></footer>

<script>
const API = "/api/links";
const $ = id => document.getElementById(id);
async function api(method, body, query = "") {
  const r = await fetch(API + query, {
    method,
    headers: body ? { "content-type": "application/json" } : {},
    body: body ? JSON.stringify(body) : undefined,
  });
  // Sem sessão: entra pela área privada e volta para cá
  if (r.status === 401) { location.replace("/privado/?volta=/salvos/" + location.hash); throw new Error("Entre pela área privada"); }
  const j = await r.json().catch(() => ({}));
  if (!r.ok) { const e = new Error(j.erro || "Não deu certo (erro " + r.status + ")"); e.status = r.status; throw e; }
  return j;
}

const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const host = u => { try { return new URL(u).hostname.replace(/^www\./, ""); } catch (e) { return u; } };

let catSel = "";
function desenha() {
  const cats = [...new Set(links.map(l => l.cat))].sort((a, b) => a.localeCompare(b, "pt-BR"));
  if (catSel && !cats.includes(catSel)) catSel = "";
  $("cats").innerHTML = cats.map(c => `<option value="${esc(c)}">`).join("");
  $("filtros").innerHTML = `<button type="button" class="chip${catSel ? "" : " on"}" data-cat="">Todas<small>${links.length}</small></button>` +
    cats.map(c => `<button type="button" class="chip${c === catSel ? " on" : ""}" data-cat="${esc(c)}">${esc(c)}<small>${links.filter(l => l.cat === c).length}</small></button>`).join("");
  $("lista").innerHTML = cats.map(c => {
    const li = links.filter(l => l.cat === c).sort((a, b) => a.t.localeCompare(b.t, "pt-BR"));
    return `<section class="cat" data-cat="${esc(c)}">
      <h2>${esc(c)} <small>${li.length}</small></h2>${li.map(l => `
      <div class="lk" data-busca="${esc((l.t + " " + l.url + " " + l.cat + " " + l.d).toLowerCase())}">
        <span class="nome"><span><a class="t" href="${esc(l.url)}" target="_blank" rel="noopener noreferrer">${esc(l.t)}</a>${l.feed ? `<span class="fonte mono" title="Fonte do blog: ${esc(l.feed)}">blog</span>` : ""}</span>
          <span class="host mono">${esc(host(l.url))}</span></span>
        <p class="d">${esc(l.d || "—")}</p>
        <span class="quando mono">${esc(l.add)}</span>
        <button class="rm" type="button" data-id="${esc(l.id)}" data-t="${esc(l.t)}">Remover</button>
      </div>`).join("")}
    </section>`;
  }).join("");
  $("total").textContent = links.length + (links.length === 1 ? " link" : " links");
  if (typeof contagens === "function" && SALVOS) contagens();
  filtra();
}

function filtra() {
  const q = $("busca").value.trim().toLowerCase();
  let algum = false;
  document.querySelectorAll(".cat").forEach(sec => {
    let n = 0;
    const naCat = !catSel || sec.dataset.cat === catSel;
    sec.querySelectorAll(".lk").forEach(c => { const ok = naCat && (!q || c.dataset.busca.includes(q)); c.hidden = !ok; if (ok) n++; });
    sec.hidden = n === 0;
    if (n) algum = true;
  });
  $("lista").hidden = !algum;
  $("vazio").hidden = algum || !links.length;
}
$("filtros").addEventListener("click", e => {
  const b = e.target.closest(".chip"); if (!b) return;
  catSel = b.dataset.cat;
  document.querySelectorAll("#filtros .chip").forEach(x => x.classList.toggle("on", x === b));
  filtra();
});

// ---------- YouTube e Instagram ----------
// Dados: /api/meudia?parte=salvos (gerados pelo /youtube-salvos e /instagram-salvos e enviados pelo meudia/site/enviar.mjs).
// "Vi" e comentários: mesmas marcações do Meu Dia (/api/meudia?parte=marcas; ids yt-* e ig-*), que o Claude lê no /meudia.
const MD = "/api/meudia";
async function md(query, opts = {}) {
  const r = await fetch(MD + "?" + query, { method: opts.method || "GET", headers: opts.body ? { "content-type": "application/json" } : {}, body: opts.body ? JSON.stringify(opts.body) : undefined });
  if (r.status === 401) { location.replace("/privado/?volta=/salvos/" + location.hash); throw new Error("Entre pela área privada"); }
  const j = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(j.erro || "Não deu certo (erro " + r.status + ")");
  return j;
}
let SALVOS = null, MARCAS = {}, THUMBS = {}, thumbsPedido = false;
let aba = "links", prio = "ver", editando = null;
const assuntoSel = { youtube: "", instagram: "" };
// "Descartados" e "Todos" só aparecem quando a aba tem descartados (Instagram, desde 08/11/2026)
const PRIOS = [["ver", "Vale ver"], ["talvez", "Talvez"], ["outros", "Já coberto e lazer"], ["descartar", "Descartados"], ["todos", "Todos"]];
const naPrio = (i, p) => p === "todos" ? true : p === "outros" ? (i.ver === "já coberto" || i.ver === "lazer") : i.ver === p;
const visto = id => !!(MARCAS[id] && MARCAS[id].done);
const POR_GRUPO = 25;
const abertos = {};
let ordem = "recentes";
try { ordem = localStorage.getItem("salvos-ordem") || "recentes"; } catch (e) {}
// Mais recente primeiro: YouTube pela posição na lista (1 = salvo por último); Instagram pela data em que foi salvo
const porRecencia = (a, b) => aba === "youtube" ? (a.ord ?? 1e9) - (b.ord ?? 1e9) : String(b.ord || "").localeCompare(String(a.ord || ""));
let esconde = false;
try { esconde = localStorage.getItem("salvos-esconde") === "1"; } catch (e) {}
$("esconde").checked = esconde;
const fmt = iso => { if (!iso) return ""; const d = new Date(iso); if (isNaN(d)) return ""; const p = n => String(n).padStart(2, "0"); return p(d.getDate()) + "/" + p(d.getMonth() + 1) + " " + p(d.getHours()) + ":" + p(d.getMinutes()); };

function contagens() {
  $("n-links").textContent = links.length;
  for (const k of ["youtube", "instagram"]) {
    const it = (SALVOS && SALVOS[k] && SALVOS[k].items) || [];
    $("n-" + k).innerHTML = it.length ? it.filter(i => i.ver === "ver" && !visto(i.id)).length + "<span class=\"pv\"> para ver</span>" : "";
  }
}

function carregaThumbs() {
  if (thumbsPedido) return;
  thumbsPedido = true;
  (async () => {
    for (let p = 0; ; p++) {
      const { thumbs, mais } = await md("parte=thumbs&pagina=" + p);
      Object.assign(THUMBS, thumbs);
      document.querySelectorAll(".vd .mini[data-id]").forEach(el => { const t = THUMBS[el.dataset.id]; if (t && !el.style.backgroundImage) el.style.backgroundImage = "url('" + t + "')"; });
      if (!mais) break;
    }
  })().catch(() => {});
}

function linhaVideo(i) {
  const m = MARCAS[i.id] || {};
  const meta = esc([i.canal, i.dur, i.idade, i.origem].filter(Boolean).join(" · ")) + (ordem === "recentes" && i.assunto ? ` · <span class="as">${esc(i.assunto)}</span>` : "");
  const t = THUMBS[i.id];
  let extra = "";
  if (editando === i.id) {
    extra = `<div class="editor"><textarea id="ta-${esc(i.id)}" placeholder="Por que guardou, o que quer estudar, o que achou…">${esc(m.note || "")}</textarea>
      <div><button type="button" class="ok" data-salvar="${esc(i.id)}">Salvar</button><button type="button" data-cancelar="1">Cancelar</button></div></div>`;
  } else if (m.note) {
    extra = `<div class="nota">${esc(m.note)}<small>${fmt(m.updatedAt)} · ${m.lidoEm ? "o Claude leu em " + fmt(m.lidoEm) : "o Claude ainda não leu"}</small></div>`;
  }
  return `<div class="vd${visto(i.id) ? " feito" : ""}" data-id="${esc(i.id)}">
    <input type="checkbox" data-vi="${esc(i.id)}" ${visto(i.id) ? "checked" : ""} aria-label="Já vi">
    <a class="mini${i.id.startsWith("ig-") ? " sq" : ""}" data-id="${esc(i.id)}" href="${esc(i.url)}" target="_blank" rel="noopener" tabindex="-1" aria-hidden="true"${t ? ` style="background-image:url('${t}')"` : ""}></a>
    <span class="nome"><a class="t" href="${esc(i.url)}" target="_blank" rel="noopener">${esc(i.t)}</a><span class="meta mono">${meta}</span></span>
    <p class="d">${esc(i.motivo || "")}</p>
    <button type="button" class="acao" data-comentar="${esc(i.id)}">${m.note ? "Editar comentário" : "Comentar"}</button>
    ${extra}
  </div>`;
}

function desenhaVideos() {
  const s = (SALVOS && SALVOS[aba]) || {};
  const itens = s.items || [];
  if (!itens.length) {
    $("vprio").innerHTML = ""; $("vassunto").innerHTML = ""; $("vlista").innerHTML = ""; $("vdesc").innerHTML = "";
    $("vfonte").textContent = s.status || "Ainda sem triagem. Peça ao Claude: /" + aba + "-salvos";
    return;
  }
  $("vfonte").textContent = s.fonte || "";
  const temDesc = itens.some(i => i.ver === "descartar");
  if (!temDesc && (prio === "descartar" || prio === "todos")) prio = "ver";
  $("vprio").innerHTML = PRIOS.filter(([p]) => temDesc || (p !== "descartar" && p !== "todos")).map(([p, rot]) => {
    const n = itens.filter(i => naPrio(i, p));
    return `<button type="button" class="chip${p === prio ? " on" : ""}" data-prio="${p}">${rot}<small>${n.filter(i => !visto(i.id)).length}/${n.length}</small></button>`;
  }).join("");
  const naFaixa = itens.filter(i => naPrio(i, prio));
  const grupos = [...new Set(naFaixa.map(i => i.assunto))];
  if (assuntoSel[aba] && !grupos.includes(assuntoSel[aba])) assuntoSel[aba] = "";
  const sel = assuntoSel[aba];
  $("vassunto").innerHTML = `<button type="button" class="chip${sel ? "" : " on"}" data-assunto="">Todos os assuntos<small>${naFaixa.length}</small></button>` +
    grupos.map(g => `<button type="button" class="chip${g === sel ? " on" : ""}" data-assunto="${esc(g)}">${esc(g)}<small>${naFaixa.filter(i => i.assunto === g).length}</small></button>`).join("");
  const q = $("vbusca").value.trim().toLowerCase();
  const mostra = i => (!esconde || !visto(i.id)) && (!q || [i.t, i.canal, i.assunto, i.motivo, i.origem].join(" ").toLowerCase().includes(q));
  document.querySelectorAll("#vordem .chip").forEach(b => b.classList.toggle("on", b.dataset.ordem === ordem));
  let html;
  if (ordem === "recentes") {
    const todos = naFaixa.filter(i => !sel || i.assunto === sel).sort(porRecencia);
    const vis = todos.filter(mostra);
    const lim = abertos[aba + "|recentes"] || 50;
    html = vis.length ? `<section class="cat"><h2>Mais recentes primeiro <small>${todos.filter(i => !visto(i.id)).length} para ver de ${todos.length}</small></h2>
      ${vis.slice(0, lim).map(linhaVideo).join("")}
      ${vis.length > lim ? `<button type="button" class="mais" data-mais="|recentes">Mostrar mais ${Math.min(vis.length - lim, 50)} (faltam ${vis.length - lim})</button>` : ""}</section>` : "";
  } else html = grupos.filter(g => !sel || g === sel).map(g => {
    const todos = naFaixa.filter(i => i.assunto === g);
    const vis = todos.filter(mostra);
    if (!vis.length) return "";
    const lim = abertos[aba + g] || (sel ? 60 : POR_GRUPO);
    return `<section class="cat"><h2>${esc(g)} <small>${todos.filter(i => !visto(i.id)).length} para ver de ${todos.length}</small></h2>
      ${vis.slice(0, lim).map(linhaVideo).join("")}
      ${vis.length > lim ? `<button type="button" class="mais" data-mais="${esc(g)}">Mostrar mais ${Math.min(vis.length - lim, 50)} (faltam ${vis.length - lim})</button>` : ""}</section>`;
  }).join("");
  $("vlista").innerHTML = html;
  $("vlista").hidden = !html;
  $("vvazio").hidden = !!html;
  const ref = (s.referencia || []).map(([m, n]) => `<li>${esc(m)}: ${n}</li>`).join("");
  const desc = (s.descartados || []).map(([m, n]) => `<li>${esc(m)}: ${n}</li>`).join("");
  $("vdesc").innerHTML = (ref ? `<details class="desc"><summary>${s.referenciaTotal} de referência pessoal (receitas, casa, lugares, treino): ficam no Instagram, sem lista aqui</summary><ul>${ref}</ul></details>` : "") +
    (desc ? `<details class="desc"><summary>${s.descartadosTotal} descartados (datados ou fora dos seus temas)</summary><ul>${desc}</ul></details>` : "");
}

async function grava(id, patch) {
  const prev = MARCAS[id] || {};
  const next = { ...prev, done: !!prev.done, note: prev.note || "", ...patch, updatedAt: new Date().toISOString() };
  MARCAS[id] = next;
  contagens(); desenhaVideos();
  try { await md("parte=marca&id=" + encodeURIComponent(id), { method: "PUT", body: next }); }
  catch (e) { alert("Não salvou: " + e.message); }
}

$("p-videos").addEventListener("click", e => {
  const b = e.target.closest("[data-prio],[data-assunto],[data-mais],[data-ordem],[data-comentar],[data-salvar],[data-cancelar]");
  if (!b) return;
  if (b.dataset.prio) { prio = b.dataset.prio; desenhaVideos(); }
  else if (b.dataset.assunto !== undefined) { assuntoSel[aba] = b.dataset.assunto; desenhaVideos(); }
  else if (b.dataset.mais) { const k = aba + b.dataset.mais; abertos[k] = (abertos[k] || (b.dataset.mais === "|recentes" ? 50 : assuntoSel[aba] ? 60 : POR_GRUPO)) + 50; desenhaVideos(); }
  else if (b.dataset.ordem) { ordem = b.dataset.ordem; try { localStorage.setItem("salvos-ordem", ordem); } catch (_) {} desenhaVideos(); }
  else if (b.dataset.comentar) { editando = b.dataset.comentar; desenhaVideos(); const ta = document.getElementById("ta-" + editando); if (ta) ta.focus(); }
  else if (b.dataset.salvar) { const id = b.dataset.salvar; const v = document.getElementById("ta-" + id).value.trim(); editando = null; grava(id, { note: v }); }
  else if (b.dataset.cancelar) { editando = null; desenhaVideos(); }
});
$("p-videos").addEventListener("change", e => {
  const c = e.target.closest("[data-vi]");
  if (c) grava(c.dataset.vi, { done: c.checked });
});
$("vbusca").addEventListener("input", desenhaVideos);
$("esconde").addEventListener("change", e => { esconde = e.target.checked; try { localStorage.setItem("salvos-esconde", esconde ? "1" : "0"); } catch (_) {} desenhaVideos(); });

function mostraAba(a) {
  if (!["links", "youtube", "instagram"].includes(a)) a = "links";
  aba = a;
  document.querySelectorAll(".aba").forEach(b => b.setAttribute("aria-selected", b.dataset.aba === a));
  $("p-links").hidden = a !== "links";
  $("p-videos").hidden = a === "links";
  if (a !== "links") { editando = null; desenhaVideos(); carregaThumbs(); }
  if (location.hash !== "#" + a) history.replaceState(null, "", "#" + a);
}
document.querySelector(".abas").addEventListener("click", e => { const b = e.target.closest(".aba"); if (b) mostraAba(b.dataset.aba); });
addEventListener("hashchange", () => mostraAba(location.hash.slice(1)));

async function entra() {
  try {
    const [l, sv, mk] = await Promise.all([api("GET"), md("parte=salvos"), md("parte=marcas")]);
    links = l.links; SALVOS = sv.salvos || {}; MARCAS = mk.marcas || {};
    $("area").hidden = false;
    desenha();
    contagens();
    mostraAba(location.hash.slice(1) || "links");
  } catch (e) {}
}

$("busca").addEventListener("input", filtra);

$("abrir-novo").addEventListener("click", () => { $("novo").hidden = false; $("n-url").focus(); });
$("cancelar").addEventListener("click", () => { $("novo").reset(); $("novo").hidden = true; $("novo-erro").textContent = ""; });

// Ao colar o endereço, sugere o nome a partir do site
$("n-url").addEventListener("change", () => {
  if ($("n-t").value) return;
  const h = host($("n-url").value);
  if (h && h !== $("n-url").value) { $("n-t").value = h.split(".")[0].replace(/^./, c => c.toUpperCase()); $("n-t").dataset.auto = "1"; }
});
// Nome sugerido fica selecionado: digitar substitui em vez de emendar
$("n-t").addEventListener("focus", () => { if ($("n-t").dataset.auto) { $("n-t").select(); delete $("n-t").dataset.auto; } });
$("n-t").addEventListener("input", () => { delete $("n-t").dataset.auto; });

$("novo").addEventListener("submit", async e => {
  e.preventDefault();
  $("salvar").disabled = true;
  $("novo-erro").textContent = "";
  try {
    const { link } = await api("POST", { url: $("n-url").value, t: $("n-t").value, cat: $("n-cat").value, d: $("n-d").value, feed: $("n-feed").value.trim() });
    links.push(link);
    $("novo").reset();
    $("novo").hidden = true;
    desenha();
  } catch (err) {
    $("novo-erro").textContent = err.message;
  } finally {
    $("salvar").disabled = false;
  }
});

$("lista").addEventListener("click", async e => {
  const b = e.target.closest(".rm");
  if (!b || !confirm(`Remover "${b.dataset.t}"?`)) return;
  b.disabled = true;
  try {
    await api("DELETE", null, "?id=" + encodeURIComponent(b.dataset.id));
    links = links.filter(l => l.id !== b.dataset.id);
    desenha();
  } catch (err) {
    alert(err.message);
    b.disabled = false;
  }
});

entra();
</script>
</body>
</html>
