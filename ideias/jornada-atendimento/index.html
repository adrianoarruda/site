<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script>/* Cópia no GitHub Pages: leva para o domínio oficial */ if (location.hostname.endsWith("github.io")) location.replace("https://www.adrianoarruda.com" + location.pathname.replace(/^\/site/, "") + location.search + location.hash);</script>
<link rel="canonical" href="https://www.adrianoarruda.com/ideias/jornada-atendimento/">
<meta name="description" content="Ideia de painel: jornada de atendimento por canal, com cards que se abrem ao passar o mouse.">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<title>Jornada de atendimento por canal</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --destaque: #cc092f;
    --destaque-escuro: #a3071f;
    --destaque-claro: #fbe7ea;
    --destaque-trilha: #f4c0c9;
    --tinta: #1d1d1f;
    --cinza: #6e6e73;
    --cinza-claro: #e6e8ec;
    --fundo: #f2f5fa;
    --branco: #ffffff;
    --sobe: #17803d;
    --desce: #d1333a;
    --raio-card: 18px;
    --raio-ctrl: 10px;
    --gap: 14px;
    --ease-out: cubic-bezier(.22, 1, .36, 1);
    --ease-spring: cubic-bezier(.34, 1.56, .64, 1);
    --dur-abrir: .62s;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: "Plus Jakarta Sans", system-ui, sans-serif;
    color: var(--tinta);
    background: var(--fundo);
    min-height: 100vh;
    display: grid;
    place-items: start center;
    padding: 44px 24px;
    -webkit-font-smoothing: antialiased;
  }

  .pagina { width: 100%; max-width: 1600px; }
  .cabecalho { display: flex; justify-content: space-between; align-items: flex-end; gap: 24px; margin-bottom: 26px; }
  .cabecalho h1 { font-size: 24px; font-weight: 800; letter-spacing: -.02em; }
  .cabecalho p { font-size: 13px; color: var(--cinza); margin-top: 4px; max-width: 70ch; }
  .atalho { font-size: 11.5px; color: var(--cinza); white-space: nowrap; }
  .atalho kbd { font: inherit; font-weight: 700; background: var(--branco); border: 1px solid #dcdfe4; border-radius: 5px; padding: 1px 6px; }

  /* ---------- Grade: trilhos da jornada + cards ---------- */
  .vitrine {
    display: grid;
    grid-template-columns: 1fr 1fr 3fr 1fr 1fr;
    grid-template-rows: auto auto;
    column-gap: var(--gap);
    row-gap: 12px;
    transition: grid-template-columns var(--dur-abrir) var(--ease-out);
  }

  .trilho { grid-row: 1; min-width: 0; padding: 0 4px; }
  .trilho .rot { display: grid; row-gap: 1px; font-size: 12px; font-weight: 700; white-space: nowrap; overflow: hidden; }
  .trilho .rot span { font-size: 11px; color: var(--cinza); font-weight: 600; font-variant-numeric: tabular-nums; }
  .trilho { display: flex; flex-direction: column; justify-content: flex-end; }
  /* Divisória do grupo: a parte vermelha é a fatia do grupo no volume total */
  .trilho .linha { position: relative; margin-top: 8px; height: 3px; border-radius: 2px; background: #e3e5ea; overflow: hidden; }
  .trilho .linha i { position: absolute; top: 0; bottom: 0; left: 0; width: max(4px, calc(var(--s) * 100%)); border-radius: 2px; background: var(--destaque); transform-origin: left; transform: scaleX(0); }
  .trilho .linha.pronta i { transform: scaleX(1); transition: transform 1s var(--ease-out); }

  /* ---------- Card ---------- */
  .card {
    grid-row: 2;
    position: relative;
    min-width: 0;
    min-height: var(--alt, 560px);
    background: var(--branco);
    border: 2px solid transparent;
    border-radius: var(--raio-card);
    box-shadow: 0 1px 2px rgba(20, 30, 60, .04), 0 10px 30px -12px rgba(20, 30, 60, .12);
    overflow: hidden;
    cursor: pointer;
    outline: none;
    opacity: 0;
    transform: translateY(24px);
    transition: border-color .3s, box-shadow .35s var(--ease-out);
  }
  .card.entrou { animation: entrada .8s var(--ease-out) forwards; animation-delay: var(--atraso, 0ms); }
  @keyframes entrada { to { opacity: 1; transform: none; } }
  .card.pronto { opacity: 1; transform: none; animation: none; }
  .card:not(.ativo):hover { box-shadow: 0 1px 2px rgba(20,30,60,.04), 0 18px 36px -14px rgba(20,30,60,.22); }
  .card.ativo { border-color: var(--destaque); cursor: default; box-shadow: 0 1px 2px rgba(20,30,60,.04), 0 24px 48px -18px rgba(204, 9, 47, .30); }
  .card:focus-visible { outline: 2px solid var(--destaque); outline-offset: 3px; }

  .selo {
    position: absolute;
    top: 0; left: 0;
    background: var(--destaque);
    color: var(--branco);
    font-size: 10.5px;
    font-weight: 700;
    padding: 5px 11px 6px 13px;
    border-radius: 0 0 12px 0;
    display: inline-flex;
    align-items: center;
    gap: 5px;
    z-index: 2;
    white-space: nowrap;
  }
  .selo svg { width: 11px; height: 11px; }

  /* ---------- Visão compacta ---------- */
  .compacto {
    position: absolute;
    inset: 0;
    padding: 30px 16px 16px;
    display: flex;
    flex-direction: column;
    transition: opacity .25s .2s, transform .45s .15s var(--ease-out);
  }
  .card.ativo .compacto { opacity: 0; transform: translateX(-16px); pointer-events: none; transition: opacity .15s, transform .3s var(--ease-out); }

  .compacto .grupo { font-size: 11px; color: var(--cinza); font-weight: 500; }
  .compacto h2 { font-size: 18px; font-weight: 800; letter-spacing: -.01em; display: flex; align-items: center; gap: 8px; margin-top: 4px; }
  .compacto h2 svg { width: 18px; height: 18px; color: var(--destaque); flex: none; }
  .c-vol { margin-top: 22px; }
  .c-vol strong { display: block; font-size: 26px; font-weight: 800; letter-spacing: -.02em; font-variant-numeric: tabular-nums; line-height: 1.05; }
  .c-vol small { font-size: 11px; color: var(--cinza); }
  .c-vol .var { display: block; font-size: 12px; font-weight: 700; margin-top: 4px; font-variant-numeric: tabular-nums; }
  .c-met { margin-top: 14px; padding-top: 12px; border-top: 1px dashed var(--cinza-claro); }
  .c-met small { display: block; font-size: 11px; font-weight: 600; color: var(--cinza); }
  .c-met strong { display: block; font-size: 20px; font-weight: 800; letter-spacing: -.01em; font-variant-numeric: tabular-nums; line-height: 1.15; }
  .c-met .var { font-size: 11.5px; font-weight: 700; font-variant-numeric: tabular-nums; }

  /* CSAT: medidor circular de 1 a 5, de vermelho (crítico) a verde (meta), com marca na meta */
  @property --a { syntax: "<percentage>"; inherits: false; initial-value: 0%; }
  .gauge { position: relative; flex: none; aspect-ratio: 1; }
  .gauge-g { width: 128px; --esp: 11px; }
  .gauge-p { width: 66px; --esp: 7px; }
  .gauge-anel {
    position: absolute; inset: 0; border-radius: 50%;
    background:
      conic-gradient(transparent 0 var(--a), #eceef2 var(--a) 100%),
      conic-gradient(#e53935 0%, #f08c1a 45%, #1e9e4a 100%);
    -webkit-mask: radial-gradient(farthest-side, transparent calc(100% - var(--esp)), #000 calc(100% - var(--esp) + 1px));
            mask: radial-gradient(farthest-side, transparent calc(100% - var(--esp)), #000 calc(100% - var(--esp) + 1px));
  }
  .gauge-anel.anima { transition: --a 1.3s var(--ease-out); }
  .gauge-meta { position: absolute; inset: 0; transform: rotate(calc(var(--m) * 1turn)); pointer-events: none; }
  .gauge-meta::before { content: ""; position: absolute; left: 50%; top: -3px; width: 2px; margin-left: -1px; height: calc(var(--esp) + 6px); border-radius: 1px; background: var(--tinta); }
  .gauge-centro { position: absolute; inset: 0; display: grid; place-content: center; text-align: center; line-height: 1.05; }
  .gauge-centro span { font-size: 10.5px; font-weight: 600; color: var(--cinza); }
  .gauge-centro b { font-size: 30px; font-weight: 800; letter-spacing: -.02em; font-variant-numeric: tabular-nums; }
  .gauge-centro small { font-size: 11px; font-weight: 600; color: #9a9aa0; }
  .gauge-p .gauge-centro b { font-size: 16px; }
  .gauge-p .gauge-meta { display: none; }

  .pill { display: inline-flex; align-items: center; gap: 3px; font-size: 11.5px; font-weight: 700; padding: 3px 8px; border-radius: 6px; font-variant-numeric: tabular-nums; white-space: nowrap; }
  .pill.sobe { background: #e7f5ec; }
  .pill.desce { background: #fde8e8; }

  .c-csat { margin-top: 22px; display: flex; align-items: center; gap: 12px; border: 1px solid #eceef2; border-radius: 12px; padding: 10px 12px; }
  .c-csat > div:last-child { display: grid; gap: 6px; justify-items: start; }
  .c-csat-rot { font-size: 11px; font-weight: 600; color: var(--cinza); }
  .c-csat .pill { font-size: 10.5px; }

  .c-etapas { margin-top: 20px; display: grid; gap: 10px; }
  .c-etapas div { font-size: 11px; color: var(--cinza); font-weight: 600; display: flex; justify-content: space-between; gap: 6px; }
  .c-etapas div span:last-child { color: var(--tinta); font-variant-numeric: tabular-nums; }
  .c-etapas i { display: block; height: 4px; border-radius: 2px; background: #f0f1f4; margin-top: 5px; overflow: hidden; }
  .c-etapas i::after { content: ""; display: block; height: 100%; width: 100%; background: var(--destaque); transform-origin: left; transform: scaleX(var(--p)); border-radius: 2px; }

  .c-pe { margin-top: auto; display: flex; justify-content: space-between; align-items: center; gap: 8px; padding-top: 14px; border-top: 1px solid #f1f2f5; }
  .c-anel { display: flex; align-items: center; gap: 8px; min-width: 0; }
  .c-anel .anel { width: 40px; height: 40px; }
  .c-anel .anel b { font-size: 10px; }
  .c-anel div:last-child { font-size: 10.5px; line-height: 1.2; color: var(--cinza); min-width: 0; }
  .c-anel div:last-child b { display: block; color: var(--tinta); font-size: 11.5px; font-weight: 700; }
  .c-abrir {
    width: 30px; height: 30px; flex: none;
    border-radius: 50%;
    background: #f0f1f4;
    display: grid; place-items: center;
    transition: background .2s, transform .35s var(--ease-spring);
  }
  .c-abrir svg { width: 14px; height: 14px; }
  .card:not(.ativo):hover .c-abrir { background: var(--destaque); color: var(--branco); transform: rotate(90deg); }

  /* ---------- Visão completa ---------- */
  .completo {
    position: absolute;
    top: 0; left: 0;
    width: var(--larg-completo, 560px);
    padding: 26px 16px 16px;
    visibility: hidden;
    opacity: 0;
    transition: opacity .2s, visibility 0s .2s;
  }
  .card.ativo .completo {
    position: relative;
    visibility: visible;
    opacity: 1;
    transition: opacity .35s .22s, visibility 0s;
  }
  /* Cada bloco entra deslizando em sequência quando o card abre */
  .completo > * { transform: translateX(18px); transition: transform .5s var(--ease-out); }
  .card.ativo .completo > * { transform: none; }
  .card.ativo .completo > :nth-child(2) { transition-delay: .26s; }
  .card.ativo .completo > :nth-child(3) { transition-delay: .32s; }
  .card.ativo .completo > :nth-child(4) { transition-delay: .38s; }
  .card.ativo .completo > :nth-child(5) { transition-delay: .44s; }

  .topo { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
  .grupo { font-size: 11.5px; color: var(--cinza); font-weight: 500; }
  .periodo { font-size: 11px; font-weight: 600; background: #f0f1f4; border-radius: var(--raio-ctrl); padding: 6px 10px; white-space: nowrap; font-variant-numeric: tabular-nums; }
  .canal { display: flex; justify-content: space-between; align-items: center; margin-top: 6px; }
  .canal h2 { font-size: 21px; font-weight: 800; letter-spacing: -.01em; display: flex; align-items: center; gap: 9px; }
  .canal h2 svg { width: 21px; height: 21px; color: var(--destaque); }
  .canal > span { font-size: 12px; font-weight: 600; }

  .corpo { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-top: 16px; }
  .valores { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 12px; }
  .valores small { display: block; font-size: 11px; color: var(--cinza); margin-bottom: 2px; }
  .valores strong { font-size: 19px; font-weight: 800; font-variant-numeric: tabular-nums; letter-spacing: -.01em; white-space: nowrap; }
  .valores small { display: flex; align-items: center; gap: 5px; }
  .valores .met-var strong { font-size: 15px; }

  .ajuda {
    position: relative;
    width: 15px; height: 15px; flex: none;
    border: 0; border-radius: 50%;
    background: #8e8e93; color: var(--branco);
    font: 700 10px/15px "Plus Jakarta Sans", sans-serif;
    cursor: help;
  }
  .ajuda::after {
    content: attr(data-dica);
    position: absolute; bottom: calc(100% + 8px); left: -10px;
    width: 210px; padding: 8px 10px; border-radius: 8px;
    background: var(--tinta); color: var(--branco);
    font-size: 11px; font-weight: 500; line-height: 1.4; text-align: left;
    opacity: 0; pointer-events: none; transform: translateY(4px);
    transition: opacity .2s, transform .2s var(--ease-out);
    z-index: 5;
  }
  .ajuda:hover::after, .ajuda:focus-visible::after { opacity: 1; transform: none; }
  .sobe { color: var(--sobe); }
  .desce { color: var(--desce); }

  .faixa { border-radius: 12px; overflow: hidden; border: 1px solid #eceef2; }
  .faixa-sec { border-top: 1px solid #eceef2; }
  .csat-dest { padding: 14px; display: flex; align-items: center; gap: 16px; }
  .csat-info { display: grid; gap: 12px; min-width: 0; }
  .delta { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 8px; font-size: 11px; color: var(--cinza); }
  .legenda-csat { display: grid; gap: 4px; font-size: 10.5px; color: var(--cinza); white-space: nowrap; }
  .legenda-csat span::before { content: ""; display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 6px; }
  .legenda-csat .l-crit::before { background: #e53935; }
  .legenda-csat .l-meta::before { background: #1e9e4a; }
  .faixa-sec { display: flex; align-items: center; gap: 10px; padding: 10px 12px; }
  .faixa-sec .anel { width: 44px; height: 44px; }
  .faixa-sec .anel b { font-size: 11px; }
  .anel { position: relative; width: 56px; height: 56px; flex: none; }
  .anel svg { width: 100%; height: 100%; transform: rotate(-90deg); }
  .anel circle { fill: none; stroke-width: 7; }
  .anel .trilha-anel { stroke: var(--destaque-trilha); }
  .anel .progresso { stroke: var(--destaque); stroke-linecap: round; stroke-dasharray: 1; stroke-dashoffset: 1; }
  .anel .progresso.anima { transition: stroke-dashoffset 1.3s var(--ease-out); }
  .anel b { position: absolute; inset: 0; display: grid; place-content: center; font-size: 13px; font-weight: 800; color: var(--destaque); font-variant-numeric: tabular-nums; }
  .anel-txt { line-height: 1.25; min-width: 0; }
  .anel-txt b { display: block; font-size: 13px; font-weight: 700; }
  .anel-txt span { font-size: 11px; color: var(--cinza); }

  .etapas { list-style: none; }
  .etapa { display: grid; grid-template-columns: 1fr 58px auto; align-items: center; gap: 10px; padding: 8px 0; border-bottom: 1px solid #f1f2f5; }
  .etapa:first-child { padding-top: 0; }
  .etapa:last-child { border-bottom: 0; }
  .etapa .nome { font-size: 11px; color: var(--cinza); font-weight: 600; white-space: nowrap; }
  .etapa .vol { font-size: 15px; font-weight: 800; font-variant-numeric: tabular-nums; letter-spacing: -.01em; white-space: nowrap; }
  .etapa .var { font-size: 10.5px; font-weight: 700; font-variant-numeric: tabular-nums; }
  .etapa .metrica { text-align: right; font-variant-numeric: tabular-nums; }
  .etapa .metrica b { display: block; font-size: 14px; font-weight: 800; color: var(--destaque); }
  .etapa .metrica span { font-size: 10px; color: var(--cinza); }
  .etapa .metrica.meta b { color: var(--sobe); }
  .etapa .metrica.critico b { color: var(--desce); }

  .lado { display: grid; justify-items: end; gap: 8px; }

  .faisca { width: 58px; height: 24px; overflow: visible; }
  .faisca .area { fill: var(--destaque-claro); opacity: 0; transition: opacity .5s .7s; }
  .faisca .linha-f { fill: none; stroke: var(--destaque); stroke-width: 1.6; stroke-linejoin: round; stroke-linecap: round; stroke-dasharray: 1; stroke-dashoffset: 1; }
  .card.ativo .faisca .linha-f { stroke-dashoffset: 0; transition: stroke-dashoffset 1.2s .35s var(--ease-out); }
  .card.ativo .faisca .area { opacity: 1; }

  .motivos { margin-top: 16px; padding-top: 14px; border-top: 1px dashed var(--cinza-claro); }
  .motivos h3 { font-size: 12px; font-weight: 700; margin-bottom: 10px; display: flex; justify-content: space-between; }
  .motivos h3 span { font-size: 10.5px; font-weight: 700; color: var(--destaque); background: var(--destaque-claro); padding: 2px 8px; border-radius: 6px; }
  .motivos ol { list-style: none; display: grid; grid-template-columns: 1fr 1fr; grid-template-rows: repeat(4, auto); grid-auto-flow: column; column-gap: 20px; row-gap: 8px; }
  .motivos li { display: grid; grid-template-columns: 12px 1fr 40px 58px; gap: 7px; align-items: center; font-size: 11px; }
  .motivos .pos { color: var(--destaque); font-weight: 800; }
  .motivos .txt { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .motivos .barra { height: 5px; border-radius: 3px; background: #f0f1f4; overflow: hidden; }
  .motivos .barra i { display: block; height: 100%; width: 100%; border-radius: 3px; background: var(--destaque); transform: scaleX(0); transform-origin: left; }
  .card.ativo .motivos .barra i { transform: scaleX(var(--p)); transition: transform .7s var(--ease-out); transition-delay: calc(.45s + var(--i) * 40ms); }
  .motivos .qtd { text-align: right; font-weight: 700; font-variant-numeric: tabular-nums; }

  .rodape { display: flex; justify-content: space-between; align-items: center; gap: 16px; margin-top: 16px; }
  .nota { font-size: 10px; color: #9a9aa0; }
  .btn-pri {
    font: inherit; font-size: 13px; font-weight: 700;
    border: 0; border-radius: var(--raio-ctrl);
    padding: 11px 22px;
    background: var(--destaque); color: var(--branco);
    cursor: pointer; position: relative; overflow: hidden; white-space: nowrap;
    transition: background .2s, transform .12s;
  }
  .btn-pri:hover { background: var(--destaque-escuro); }
  .btn-pri:active { transform: scale(.98); }
  .btn-pri:focus-visible { outline: 2px solid var(--destaque); outline-offset: 2px; }
  .btn-pri .onda { position: absolute; border-radius: 50%; background: rgba(255,255,255,.45); transform: scale(0); animation: onda .6s ease-out forwards; pointer-events: none; }
  @keyframes onda { to { transform: scale(4); opacity: 0; } }

  /* ---------- Telas menores: acordeão vertical ---------- */
  @media (max-width: 1080px) {
    .cabecalho { flex-direction: column; align-items: flex-start; }
    .atalho { display: none; }
    .vitrine { grid-template-columns: 1fr !important; grid-template-rows: none; max-width: 620px; margin-inline: auto; }
    .trilho { display: none; }
    .card { grid-row: auto; grid-column: auto !important; min-height: 0; }
    .compacto { position: relative; inset: auto; display: grid; grid-template-columns: minmax(0, 1fr) auto; column-gap: 14px; align-items: center; padding: 24px 16px 16px; }
    .compacto > :not(.cab-c):not(.c-csat) { display: none; }
    .c-csat { margin: 0; min-width: 170px; }
    .lado { justify-items: start; }
    .card.ativo .compacto { display: none; }
    .completo { width: auto; position: absolute; }
    .card.ativo .completo { width: auto; }
    .corpo { grid-template-columns: 1fr; }
  }
  @media (max-width: 560px) {
    .compacto { grid-template-columns: minmax(0, 1fr); row-gap: 12px; }
    .c-csat { min-width: 0; }
    .motivos ol { grid-template-columns: 1fr; grid-template-rows: none; grid-auto-flow: row; }
    .rodape { flex-direction: column; align-items: stretch; }
  }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation: none !important; transition: none !important; }
    .card { opacity: 1 !important; transform: none !important; }
    .trilho .linha i { transform: none !important; }
  }
</style>
</head>
<body>

<div class="pagina">
  <header class="cabecalho">
    <div>
      <h1>Jornada de atendimento</h1>
      <p>Segmento Espontâneo. Volume, satisfação e principais motivos de cada canal de atendimento.</p>
    </div>
    <div class="lado">
      <span class="atalho">Passe o mouse ou use <kbd>←</kbd> <kbd>→</kbd> para trocar de canal</span>
    </div>
  </header>
  <main class="vitrine" id="vitrine" aria-label="Canais de atendimento"></main>
</div>

<template id="tpl-card">
  <article class="card" tabindex="0">
    <div class="compacto" aria-hidden="true">
      <div class="cab-c">
        <div class="grupo" data-c="grupo"></div>
        <h2><span class="icone"></span><span data-c="canal"></span></h2>
      </div>
      <div class="c-vol"><strong data-c="total"></strong><small data-c="unidade"></small><span class="var" data-c="variacao"></span></div>

    return Array.from({ length: n }, (_, i) => 0.5 + 0.28 * Math.sin(i / 2.1 + semente) + (r() - 0.5) * 0.45);
  }
  function faisca(semente) {
    const pts = serie(semente), w = 58, h = 24;
    const min = Math.min(...pts), max = Math.max(...pts);
    const d = pts.map((p, i) => (i ? "L" : "M") + ((i / (pts.length - 1)) * w).toFixed(1) + " " + (h - 2 - ((p - min) / (max - min)) * (h - 4)).toFixed(1)).join(" ");
    return `<svg class="faisca" viewBox="0 0 ${w} ${h}" aria-hidden="true"><path class="area" d="${d} L${w} ${h} L0 ${h} Z"/><path class="linha-f" d="${d}" pathLength="1"/></svg>`;
  }

      const t = Math.min((agora - inicio) / duracao, 1);

      card.querySelector(".completo").inert = !on;
    });
    const c = canais[i], card = cards[i];
    const F = k => card.querySelector(`[data-f="${k}"]`);
    animarAnel(card.querySelector(".faixa .anel"), c.anel.pct, 250);
    animarGauge(card.querySelector(".csat-dest .gauge-anel"), c.csat, 250);
    if (recontar) {
      setTimeout(() => {
        contar(F("total"), c.total, 1000, compacto);
        contar(F("variacao"), c.variacao, 1000, pctSinal);
        contar(F("metValor"), c.metrica.valor, 1000, v => fmtMetrica(c.metrica, v));
        contar(F("csat"), c.csat, 1100, v => num(v, 2));
        contar(F("anelPct"), c.anel.pct, 1200, v => z(Math.round(v)) + "%");
      }, reduzMovimento ? 0 : 220);
    }
  }

  // Intenção de hover: evita que o card abra só porque o mouse cruzou por cima dele
  let espera;
  cards.forEach((card, i) => {
    card.addEventListener("mouseenter", () => { clearTimeout(espera); espera = setTimeout(() => ativar(i), 110); });
    card.addEventListener("mouseleave", () => clearTimeout(espera));
    card.addEventListener("click", () => ativar(i));
    card.addEventListener("focus", () => ativar(i));
    card.addEventListener("keydown", e => {
      if (e.target !== card) return;
      if (e.key === "ArrowRight" || e.key === "ArrowLeft") {
        e.preventDefault();
        const prox = (i + (e.key === "ArrowRight" ? 1 : -1) + cards.length) % cards.length;
        cards[prox].focus();
      }
    });
  });

  // Largura fixa do conteúdo completo = largura do card aberto, para o texto não refluir enquanto o card cresce
  function medir() {
    if (telaEstreita.matches) { vitrine.style.removeProperty("--alt"); return; }
    const W = vitrine.clientWidth;
    const gaps = (canais.length - 1) * parseFloat(getComputedStyle(vitrine).columnGap);
    const larg = (W - gaps) * FR_ATIVO / (canais.length - 1 + FR_ATIVO) - 4;
    vitrine.style.setProperty("--larg-completo", larg + "px");
    const alt = Math.max(...cards.map(c => c.querySelector(".completo").scrollHeight));
    vitrine.style.setProperty("--alt", alt + 4 + "px");
  }

  // ---------- Entrada ----------
  const inicial = canais.findIndex(c => c.canal === "Chat");
  document.fonts.ready.then(() => {
    medir();
    ativar(inicial, { contar: false });
    vitrine.querySelectorAll(".trilho .linha").forEach((l, k) => setTimeout(() => l.classList.add("pronta"), reduzMovimento ? 0 : 150 + k * 160));
    cards.forEach((card, i) => {
      card.classList.add("entrou");
      card.addEventListener("animationend", ev => {
        if (ev.animationName === "entrada") { card.classList.remove("entrou"); card.classList.add("pronto"); }
      });
      animarAnel(card.querySelector(".c-anel .anel"), canais[i].anel.pct, 400 + i * 90);
      animarGauge(card.querySelector(".c-csat .gauge-anel"), canais[i].csat, 400 + i * 90);
    });
    const c = canais[inicial], F = k => cards[inicial].querySelector(`[data-f="${k}"]`);
    setTimeout(() => {
      contar(F("total"), c.total, 1200, compacto);
      contar(F("variacao"), c.variacao, 1200, pctSinal);
      contar(F("metValor"), c.metrica.valor, 1200, v => fmtMetrica(c.metrica, v));
      contar(F("csat"), c.csat, 1200, v => num(v, 2));
      contar(F("anelPct"), c.anel.pct, 1300, v => z(Math.round(v)) + "%");
    }, reduzMovimento ? 0 : 450);
  });
  addEventListener("resize", medir);
  telaEstreita.addEventListener("change", medir);
</script>
</body>
</html>
